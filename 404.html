<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>404 — CHENNN STUDIO®</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./styles.css?v=404-086" />
    <link rel="stylesheet" href="./chen-fx/03-page-transition/style.css" />
    <style>
      :root { --chen-page-bg: #050505; }

      html {
        scroll-behavior: smooth;
      }

      body {
        background:
          radial-gradient(circle at 70% 28%, rgba(156, 255, 82, 0.13), transparent 24rem),
          radial-gradient(circle at 16% 78%, rgba(156, 255, 82, 0.07), transparent 20rem),
          radial-gradient(circle, rgba(244, 243, 237, 0.15) 0 0.06rem, transparent 0.07rem),
          linear-gradient(rgba(244, 243, 237, 0.035) 1px, transparent 1px),
          linear-gradient(90deg, rgba(244, 243, 237, 0.035) 1px, transparent 1px),
          #050505;
        background-size: 100% 100%, 100% 100%, 1.15rem 1.15rem, 88px 88px, 88px 88px, 100% 100%;
        color: #f6f6f1;
        min-height: 100vh;
        overflow-x: hidden;
      }

      .lost-page {
        align-items: center;
        display: grid;
        justify-items: center;
        min-height: 100vh;
        padding: clamp(1.5rem, 4vw, 4rem);
        position: relative;
        isolation: isolate;
      }

      .lost-page::before,
      .lost-page::after {
        content: "";
        inset: clamp(1rem, 2vw, 2rem);
        pointer-events: none;
        position: absolute;
        z-index: -1;
      }

      .lost-page::before {
        background:
          linear-gradient(90deg, transparent 0 7%, rgba(156, 255, 82, 0.7) 7% 7.12%, transparent 7.12%),
          linear-gradient(90deg, transparent 0 calc(100% - 6.8rem), rgba(156, 255, 82, 0.42) calc(100% - 6.8rem) calc(100% - 6.68rem), transparent calc(100% - 6.68rem)),
          linear-gradient(0deg, transparent 0 18%, rgba(244, 243, 237, 0.28) 18% calc(18% + 1px), transparent calc(18% + 1px)),
          linear-gradient(0deg, transparent 0 82%, rgba(244, 243, 237, 0.22) 82% calc(82% + 1px), transparent calc(82% + 1px));
        opacity: 0.8;
      }

      .lost-page::after {
        background:
          radial-gradient(circle, rgba(244, 243, 237, 0.68) 0 0.18rem, transparent 0.2rem),
          linear-gradient(90deg, transparent 0 72%, rgba(156, 255, 82, 0.9) 72% 85%, transparent 85%);
        background-position:
          0.2rem 0.15rem,
          0 0;
        background-size:
          1rem 1rem,
          100% 100%;
        clip-path: polygon(2% 11%, 13% 11%, 13% 21%, 2% 21%);
        opacity: 0.85;
      }

      .lost-card {
        display: grid;
        gap: clamp(2rem, 5vw, 4rem);
        grid-template-columns: minmax(0, 1fr) minmax(18rem, 0.46fr);
        margin: 0 auto;
        max-width: 86rem;
        position: relative;
        width: 100%;
      }

      .lost-card::after {
        border: 1px solid rgba(244, 243, 237, 0.18);
        border-left: 0.22rem solid #9cff52;
        content: "";
        inset: -1.2rem -1rem;
        pointer-events: none;
        position: absolute;
        transform: skew(-2deg);
        z-index: -1;
      }

      .lost-code {
        color: #9cff52;
        font-size: clamp(7rem, 20vw, 20rem);
        font-style: oblique;
        font-weight: 900;
        letter-spacing: 0;
        line-height: 0.78;
        margin: 0;
        text-shadow: 0 0 38px rgba(156, 255, 82, 0.2);
      }

      .lost-copy {
        align-self: end;
        border-left: 1px solid rgba(246, 246, 241, 0.16);
        padding-left: clamp(1.25rem, 3vw, 2.5rem);
      }

      .lost-copy h1 {
        font-size: clamp(2.3rem, 5vw, 5rem);
        font-weight: 850;
        letter-spacing: 0;
        line-height: 0.9;
        margin: 0 0 1rem;
        text-transform: uppercase;
      }

      .lost-copy p {
        color: rgba(246, 246, 241, 0.68);
        font-size: clamp(1rem, 1.4vw, 1.25rem);
        line-height: 1.35;
        margin: 0 0 1.4rem;
      }

      .lost-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.72rem;
      }

      .lost-actions a {
        border: 1px solid rgba(246, 246, 241, 0.16);
        border-radius: 999px;
        color: #f6f6f1;
        font-size: 0.88rem;
        font-weight: 900;
        padding: 0.78rem 1rem;
        text-decoration: none;
        text-transform: uppercase;
        transition:
          background-color 0.24s ease,
          color 0.24s ease,
          transform 0.24s cubic-bezier(0.2, 0.8, 0.2, 1);
      }

      .lost-actions a:first-child,
      .lost-actions a:hover,
      .lost-actions a:focus-visible {
        background: #9cff52;
        color: #050505;
        transform: translate3d(0, -0.12rem, 0);
      }

      @media (max-width: 760px) {
        .lost-card {
          gap: 1.5rem;
          grid-template-columns: 1fr;
          text-align: center;
        }

        .lost-copy {
          border-left: 0;
          border-top: 1px solid rgba(246, 246, 241, 0.16);
          padding-left: 0;
          padding-top: 1.5rem;
          text-align: left;
        }

        .lost-code {
          font-size: clamp(5rem, 26vw, 10rem);
        }
      }
    </style>
  </head>
  <body class="chen-page chen-page--lite">
    <main class="lost-page" aria-label="404">
      <section class="lost-card">
        <p class="lost-code">404</p>
        <div class="lost-copy">
          <h1>World<br />not found.</h1>
          <p>这个页面还没有被放进 CHENNN World。先回到眼睛入口、作品索引，或者进入 Tangyuan IP Doorway。</p>
          <div class="lost-actions">
            <a href="./index.html">World Entry</a>
            <a href="./projects.html?skipIntro=1">Projects</a>
            <a href="./about.html">About</a>
            <a href="./services.html">Services</a>
            <a href="./ip-mask-demo.html?v=skin-ui-088">IP Doorway</a>
          </div>
        </div>
      </section>
    </main>
    <script src="./chen-fx/03-page-transition/script.js"></script>
  </body>
</html>
