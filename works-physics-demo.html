<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>CHENNN Studio - Works Physics Demo</title>
    <link rel="icon" href="data:," />
    <script src="./assets/vendor/gsap.min.js"></script>
    <script src="./assets/vendor/CustomEase.min.js"></script>
    <style>
      @font-face {
        font-display: swap;
        font-family: "Smiley Sans";
        font-style: oblique;
        font-weight: 100 900;
        src: url("./assets/fonts/SmileySans-Oblique-2.ttf") format("truetype");
      }

      :root {
        --acid: #9cff52;
        --acid-rgb: 156 255 82;
        --mark: #9cff52;
        --mark-rgb: 156 255 82;
        --active-color: #9cff52;
        --active-color-rgb: 156 255 82;
        --paper: #050505;
        --print: #f4f3ed;
        --ink: #f4f3ed;
        --muted: rgba(244, 243, 237, 0.58);
        --line: rgba(244, 243, 237, 0.16);
        --font-main: "Smiley Sans", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --font-mono: ui-monospace, "SFMono-Regular", Menlo, Monaco, Consolas, monospace;
        --ease: cubic-bezier(0.22, 1, 0.36, 1);
        --card-w: clamp(1064px, 83.6vw, 1463px);
        --card-h: min(calc(var(--card-w) * 0.5625), 86vh);
        --card-gyro-x: 0deg;
        --card-gyro-y: 0deg;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
        overflow: hidden;
      }

      body {
        --active-media: url("./assets/projects/the-symphony-of-vines/Group 2090057975.png");
        background:
          radial-gradient(circle at 78% 36%, rgba(var(--active-color-rgb) / 0.22), transparent 0 34rem),
          radial-gradient(circle at 16% 74%, rgba(var(--mark-rgb) / 0.09), transparent 0 18rem),
          linear-gradient(90deg, rgba(5, 5, 5, 0.98), rgba(5, 5, 5, 0.88) 42%, rgba(5, 5, 5, 0.98)),
          #050505;
        color: var(--ink);
        font-family: var(--font-main);
        margin: 0;
        text-rendering: geometricPrecision;
      }

      body::before {
        background:
          radial-gradient(circle, rgba(244, 243, 237, 0.22) 0 0.075rem, transparent 0.085rem),
          linear-gradient(90deg, rgba(244, 243, 237, 0.08) 1px, transparent 1px),
          linear-gradient(rgba(244, 243, 237, 0.04) 1px, transparent 1px);
        background-size: 0.92rem 0.92rem, 6.4rem 100%, 100% 6.4rem;
        content: "";
        inset: 0;
        opacity: 0.34;
        pointer-events: none;
        position: fixed;
        z-index: 4;
      }

      body::after {
        background:
          linear-gradient(90deg, rgba(5, 5, 5, 0.74), transparent 32%, rgba(5, 5, 5, 0.42)),
          linear-gradient(180deg, rgba(5, 5, 5, 0.5), transparent 28%, transparent 66%, rgba(5, 5, 5, 0.68));
        content: "";
        inset: 0;
        pointer-events: none;
        position: fixed;
        z-index: 8;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      .change-mark {
        color: rgba(244, 243, 237, 0.96) !important;
        text-shadow:
          0 0 1.2rem rgba(244, 243, 237, 0.34),
          0.045em 0.045em 0 rgba(5, 5, 5, 0.65);
      }

      button {
        font: inherit;
      }

      .works-demo {
        min-height: 100dvh;
        overflow: hidden;
        position: relative;
      }

      .cinema-backdrop {
        inset: -8vh -8vw;
        opacity: 0.78;
        pointer-events: none;
        position: fixed;
        z-index: 1;
      }

      .cinema-backdrop::before {
        background: var(--active-media);
        background-position: center;
        background-size: cover;
        content: "";
        filter: blur(22px) saturate(1.08) contrast(1.18) brightness(0.42);
        inset: 0;
        opacity: 0.82;
        position: absolute;
        transform: scale(1.08);
      }

      .cinema-backdrop::after {
        background:
          radial-gradient(circle at 62% 42%, rgba(var(--active-color-rgb) / 0.56), transparent 0 38rem),
          linear-gradient(90deg, rgba(5, 5, 5, 0.88), rgba(var(--active-color-rgb) / 0.22) 46%, rgba(5, 5, 5, 0.46)),
          linear-gradient(180deg, rgba(5, 5, 5, 0.3), rgba(5, 5, 5, 0.76));
        content: "";
        inset: 0;
        position: absolute;
      }

      .demo-topbar {
        align-items: center;
        color: rgba(244, 241, 232, 0.86);
        display: flex;
        font-size: clamp(0.72rem, 0.72vw, 0.84rem);
        font-weight: 850;
        gap: 1.2rem;
        justify-content: space-between;
        left: 0;
        letter-spacing: 0.02em;
        min-height: 5.8rem;
        padding: clamp(1.05rem, 2.15vw, 1.9rem) clamp(1.3rem, 2.85vw, 2.5rem);
        position: fixed;
        right: 0;
        text-transform: uppercase;
        top: 0;
        z-index: 30;
      }

      .demo-topbar__brand {
        align-items: center;
        display: flex;
        gap: 1.5rem;
        justify-self: start;
        white-space: nowrap;
      }

      .demo-topbar__brand-text {
        font-size: clamp(1.02rem, 1.16vw, 1.35rem);
        letter-spacing: 0.02em;
      }

      .demo-topbar__center {
        color: var(--mark);
        font-family: var(--font-mono);
        font-size: clamp(0.68rem, 0.8vw, 0.82rem);
        font-weight: 900;
        left: 50%;
        letter-spacing: 0.18em;
        position: fixed;
        text-shadow: 0 0 1rem rgba(var(--mark-rgb) / 0.28);
        top: clamp(1.5rem, 2vw, 2.05rem);
        transform: translateX(-50%);
        white-space: nowrap;
        z-index: 31;
      }

      .demo-topbar__socials {
        align-items: center;
        color: rgba(244, 241, 232, 0.38);
        display: inline-flex;
        font-family: var(--font-mono);
        font-size: 0.7rem;
        gap: 0.48rem;
        text-transform: none;
      }

      .demo-topbar__label {
        align-items: center;
        background: rgba(244, 241, 232, 0.94);
        border-radius: 999px;
        color: #151510;
        display: inline-flex;
        font-family: var(--font-mono);
        font-size: 0.76rem;
        gap: 1rem;
        justify-content: center;
        min-height: 2.72rem;
        min-width: 18rem;
        padding: 0.28rem 0.34rem 0.28rem 1.14rem;
        text-transform: none;
      }

      .demo-topbar__label::after {
        align-items: center;
        background: #11120f;
        border-radius: 999px;
        color: rgba(244, 241, 232, 0.96);
        content: "是的";
        display: inline-flex;
        font-size: 0.68rem;
        height: 2.08rem;
        justify-content: center;
        margin-left: auto;
        min-width: 3.45rem;
      }

      .demo-topbar__right {
        align-items: center;
        display: flex;
        gap: 1.55rem;
        justify-content: flex-end;
        white-space: nowrap;
      }

      .demo-topbar__link {
        background: transparent;
        border: 1px solid rgba(244, 241, 232, 0.74);
        border-radius: 999px;
        color: rgba(244, 241, 232, 0.94);
        justify-self: end;
        min-height: 2.5rem;
        padding: 0.7rem 1.35rem;
        transition:
          background-color 0.22s ease,
          color 0.22s ease,
          transform 0.22s var(--ease);
      }

      .demo-topbar__link:hover,
      .demo-topbar__link:focus-visible {
        background: rgba(244, 241, 232, 0.94);
        color: #0c1108;
        transform: translateY(-0.12rem);
      }

      .demo-topbar__ghost,
      .demo-topbar__audio,
      .demo-topbar__bell {
        color: rgba(244, 241, 232, 0.86);
        font-family: var(--font-mono);
        font-size: 0.74rem;
        text-decoration: none;
      }

      .demo-topbar__audio {
        letter-spacing: -0.18em;
      }

      .demo-chrome {
        align-items: center;
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        left: 0;
        padding: clamp(1.25rem, 2vw, 2.2rem) clamp(1.5rem, 3vw, 3.2rem);
        pointer-events: none;
        position: fixed;
        right: 0;
        top: 0;
        z-index: 60;
      }

      .demo-chrome__brand,
      .demo-chrome__title,
      .demo-chrome__back {
        pointer-events: auto;
      }

      .demo-chrome__brand,
      .demo-chrome__back {
        color: rgba(244, 241, 232, 0.95);
        font-size: clamp(0.78rem, 0.9vw, 1rem);
        font-style: oblique;
        font-weight: 650;
        letter-spacing: 0.02em;
        text-transform: uppercase;
      }

      .demo-chrome__title {
        color: var(--mark);
        font-family: var(--font-mono);
        font-size: clamp(0.66rem, 0.72vw, 0.82rem);
        font-weight: 900;
        letter-spacing: 0.24em;
        text-align: center;
        text-transform: uppercase;
      }

      .demo-chrome__back {
        align-items: center;
        background: rgba(244, 241, 232, 0.94);
        border-radius: 999px;
        color: #171812;
        display: inline-flex;
        justify-self: end;
        min-height: 3rem;
        padding: 0.7rem 1.35rem;
      }

      .works-info {
        bottom: auto;
        display: grid;
        gap: clamp(0.74rem, 0.88vw, 1.05rem);
        left: clamp(1.35rem, 6.4vw, 7.8rem);
        max-width: min(24rem, 24vw);
        padding: 0;
        position: fixed;
        top: 25vh;
        transform: none;
        z-index: 34;
      }

      .works-kicker {
        color: var(--mark) !important;
        display: block;
        font-family: var(--font-mono);
        font-size: clamp(0.66rem, 0.76vw, 0.82rem);
        font-weight: 900;
        justify-self: start;
        letter-spacing: 0.18em;
        margin: 0;
        min-height: auto;
        padding: 0;
        text-shadow: 0 0 1rem rgba(var(--mark-rgb) / 0.34);
        text-transform: uppercase;
      }

      .works-kicker::before {
        content: none;
      }

      .works-title {
        align-self: start;
        color: rgba(255, 255, 248, 0.98);
        font-size: clamp(2.35rem, 3.25vw, 4.7rem);
        font-style: oblique;
        font-weight: 620;
        letter-spacing: 0;
        line-height: 0.86;
        margin: 0;
        max-width: 10.5ch;
        overflow: visible;
        overflow-wrap: anywhere;
        text-transform: uppercase;
        text-shadow: 0 0.55rem 1.4rem rgba(0, 0, 0, 0.58);
      }

      .works-title span {
        color: #fff;
        display: block;
        text-shadow: 0 0.55rem 1.4rem rgba(0, 0, 0, 0.58);
      }

      .works-title .split-char {
        backface-visibility: hidden;
        display: inline-block;
        filter: blur(0);
        line-height: 1;
        transform: translate3d(0, 0, 0);
        transform-origin: 50% 100%;
        will-change: opacity, transform;
      }

      .works-title.is-rebuilding .split-char {
        animation: title-rebuild 1120ms cubic-bezier(0.16, 1, 0.3, 1) both;
        animation-delay: var(--rebuild-delay, 0ms);
      }

      @keyframes title-rebuild {
        0% {
          filter: blur(12px);
          opacity: 0;
          text-shadow: 0 0 0 rgba(var(--active-color-rgb) / 0);
          transform:
            translate3d(var(--scatter-x, 0px), var(--scatter-y, 34%), 0)
            rotateZ(var(--scatter-rot, 0deg))
            rotateX(-42deg)
            scaleX(0.64)
            scaleY(0.44);
        }

        42% {
          filter: blur(4px);
          opacity: 1;
          text-shadow:
            0 0 1.2rem rgba(var(--active-color-rgb) / 0.62),
            0 0 2.8rem rgba(255, 255, 248, 0.28);
          transform:
            translate3d(calc(var(--scatter-x, 0px) * -0.12), -6%, 0)
            rotateZ(calc(var(--scatter-rot, 0deg) * -0.18))
            rotateX(10deg)
            scaleX(1.08)
            scaleY(1.16);
        }

        100% {
          filter: blur(0);
          opacity: 1;
          text-shadow: 0 0.55rem 1.4rem rgba(0, 0, 0, 0.58);
          transform:
            translate3d(0, 0, 0)
            rotateZ(0deg)
            rotateX(0deg)
            scaleX(1)
            scaleY(1);
        }
      }

      .works-title .title-line {
        display: block;
        filter: none;
        line-height: 0.86;
        margin-block: 0;
        overflow: visible;
        padding-block: 0.12em;
      }

      .works-copy {
        align-self: start;
        display: grid;
        gap: 1.18rem;
      }

      .works-kind {
        color: rgba(244, 241, 232, 0.82) !important;
        font-family: var(--font-mono);
        font-size: clamp(0.78rem, 0.86vw, 0.98rem);
        font-weight: 930;
        letter-spacing: 0.09em;
        margin: 0;
        text-shadow: none;
        text-transform: uppercase;
      }

      .works-desc {
        color: rgba(244, 241, 232, 0.58) !important;
        font-size: clamp(0.72rem, 0.72vw, 0.82rem);
        font-weight: 720;
        line-height: 1.24;
        margin: 0;
        max-width: 18.5rem;
        text-shadow: none;
      }

      .works-actions {
        align-items: center;
        display: flex;
        gap: 0.8rem;
        margin-top: 0.28rem;
      }

      .open-link {
        align-items: center;
        background: rgba(244, 243, 237, 0.94);
        border: 0;
        border-radius: 999px;
        box-shadow: 0 1.8rem 4rem rgba(0, 0, 0, 0.24);
        color: color-mix(in srgb, var(--active-color) 70%, #16140f 30%) !important;
        display: inline-flex;
        font-family: var(--font-mono);
        font-size: 0.78rem;
        font-weight: 950;
        gap: 0.55rem;
        justify-content: center;
        letter-spacing: 0.2em;
        min-height: 3.8rem;
        min-width: min(13.5rem, 100%);
        padding: 0.78rem 1.28rem;
        text-shadow: none;
        text-transform: uppercase;
        transition:
          filter 0.22s ease,
          transform 0.22s var(--ease);
      }

      .open-link:hover,
      .open-link:focus-visible {
        background: var(--print);
        filter: saturate(1.02) brightness(1.02);
        color: #050505 !important;
        transform: translateY(-0.14rem) scale(1.02);
      }

      .open-link:active {
        transform: translateY(0) scale(0.98);
      }

      .works-count {
        align-items: center;
        background: rgba(5, 6, 4, 0.42);
        border: 1px solid rgba(244, 241, 232, 0.2);
        border-radius: 999px;
        color: rgba(244, 241, 232, 0.72);
        display: inline-flex;
        font-family: var(--font-mono);
        font-size: 0.78rem;
        font-weight: 850;
        min-height: 3.15rem;
        padding: 0.78rem 0.95rem;
        text-shadow: none;
      }

      .physics-stage {
        height: 100dvh;
        overflow: hidden;
        position: fixed;
        right: 0;
        top: 0;
        width: 100vw;
        z-index: 12;
      }

      .physics-track {
        height: 100%;
        left: 54%;
        opacity: 1;
        pointer-events: auto;
        position: absolute;
        top: 0;
        transform:
          translateX(-50%)
          rotateX(calc(var(--card-gyro-y) * 0.34))
          rotateY(calc(var(--card-gyro-x) * 0.34));
        transform-origin: 32% 48%;
        transform-style: preserve-3d;
        width: var(--card-w);
      }

      .work-card {
        aspect-ratio: 16 / 9;
        background:
          linear-gradient(120deg, rgba(255, 255, 255, 0.08), transparent 42%),
          rgba(255, 255, 255, 0.035);
        border: 1px solid rgba(244, 241, 232, 0.22);
        border-radius: clamp(1.4rem, 2.4vw, 2.65rem);
        color: var(--ink);
        cursor: pointer;
        display: block;
        height: var(--card-h);
        left: 50%;
        overflow: hidden;
        position: absolute;
        top: 50%;
        transform: translate(-50%, -50%);
        transform-style: preserve-3d;
        width: var(--card-w);
        backface-visibility: hidden;
        contain: layout paint style;
        will-change: transform, opacity;
        box-shadow:
          -2.4rem 3.4rem 6.2rem rgba(0, 0, 0, 0.5),
          0 0 0 1px rgba(var(--mark-rgb) / 0.06) inset,
          1.2rem 0 2.4rem rgba(255, 255, 255, 0.04) inset,
          -1.7rem 0 3.4rem rgba(0, 0, 0, 0.36) inset;
      }

      .work-card::marker {
        display: none;
      }

      .work-card::before {
        background: var(--media);
        background-position: center;
        background-size: cover;
        content: "";
        inset: 0;
        opacity: 0.96;
        position: absolute;
        backface-visibility: hidden;
        transform: translateZ(-1px) scaleX(1.025) scaleY(1.035);
        transition:
          filter 0.42s ease,
          opacity 0.42s ease,
          transform 0.72s var(--ease);
      }

      .work-card::after {
        background:
          linear-gradient(90deg, rgba(5, 6, 4, 0.84), rgba(5, 6, 4, 0.16) 22%, rgba(5, 6, 4, 0.02) 48%, rgba(5, 6, 4, 0.22) 82%, rgba(5, 6, 4, 0.62)),
          linear-gradient(180deg, rgba(255, 255, 255, 0.08), transparent 28%, rgba(0, 0, 0, 0.42)),
          radial-gradient(ellipse at 44% 42%, rgba(255, 255, 255, 0.2), transparent 0 35%),
          radial-gradient(ellipse at 52% 46%, rgba(var(--mark-rgb) / 0.13), transparent 0 22rem),
          radial-gradient(ellipse at 50% 48%, transparent 0 32%, rgba(255, 255, 255, 0.1) 41%, rgba(0, 0, 0, 0.18) 72%, transparent 84%),
          radial-gradient(circle, rgba(255, 255, 255, 0.14) 0 1px, transparent 1.2px);
        background-size: auto, auto, auto, auto, auto, 4px 4px;
        content: "";
        inset: 0;
        position: absolute;
      }

      .work-card__video {
        border-radius: inherit;
        display: block;
        filter: saturate(1.04) brightness(0.92) contrast(1.04);
        height: 100%;
        inset: 0;
        object-fit: cover;
        opacity: 0;
        pointer-events: none;
        position: absolute;
        transform: translateZ(8px) scale(1.03);
        transition:
          opacity 0.46s ease,
          transform 0.7s var(--ease);
        width: 100%;
        z-index: 1;
      }

      .work-card.is-playing .work-card__video {
        opacity: 1;
        transform: translateZ(8px) scale(1);
      }

      .work-card__warp {
        background:
          radial-gradient(ellipse at 43% 45%, rgba(255, 255, 255, 0.28), transparent 0 30%, rgba(0, 0, 0, 0.3) 78%),
          linear-gradient(90deg, rgba(255, 255, 255, 0.12), transparent 19%, transparent 72%, rgba(0, 0, 0, 0.4)),
          linear-gradient(105deg, transparent 0 42%, rgba(255, 255, 255, 0.16) 48%, transparent 56%);
        border-radius: inherit;
        inset: 0;
        mix-blend-mode: soft-light;
        opacity: 0.92;
        pointer-events: none;
        position: absolute;
        transform: translateZ(30px);
        backface-visibility: hidden;
        z-index: 3;
      }

      .work-card__inner {
        display: block;
        height: 100%;
        position: relative;
        z-index: 2;
      }

      .work-card__copy {
        display: none;
      }

      .work-card__index,
      .work-card__tag {
        color: var(--acid);
        font-family: var(--font-mono);
        font-size: clamp(0.66rem, 0.72vw, 0.78rem);
        font-weight: 850;
        letter-spacing: 0.1em;
        margin: 0;
        text-transform: uppercase;
      }

      .work-card__title {
        color: rgba(244, 241, 232, 0.94);
        font-size: clamp(2.4rem, 4.8vw, 6.8rem);
        font-weight: 560;
        letter-spacing: 0;
        line-height: 0.78;
        margin: 0;
        max-width: 7.5ch;
        overflow-wrap: anywhere;
        text-transform: uppercase;
      }

      .work-card__kind {
        color: rgba(244, 241, 232, 0.64);
        font-size: clamp(0.92rem, 1vw, 1.12rem);
        font-weight: 700;
        line-height: 1;
        margin: 0;
        max-width: 18rem;
      }

      .work-card__media {
        align-items: end;
        display: flex;
        justify-content: flex-end;
        padding: clamp(1.05rem, 1.5vw, 1.7rem);
        position: relative;
        height: 100%;
        transform: translateZ(70px);
      }

      .work-card__button {
        align-items: center;
        background: rgba(244, 241, 232, 0.9);
        border: 0;
        border-radius: 999px;
        color: #121510;
        display: inline-flex;
        font-family: var(--font-mono);
        font-size: 0.72rem;
        font-weight: 850;
        gap: 0.5rem;
        letter-spacing: 0.1em;
        min-height: 3.25rem;
        min-width: 7.2rem;
        padding: 0.72rem 1.14rem;
        text-transform: uppercase;
      }

      .work-card__media .work-card__button {
        display: none !important;
      }

      .play-badge {
        align-items: center;
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        background: rgba(244, 241, 232, 0.92);
        border: 1px solid rgba(255, 255, 255, 0.28);
        border-radius: 999px;
        color: var(--mark);
        display: inline-flex;
        font-family: var(--font-mono);
        font-size: 0.74rem;
        font-weight: 900;
        gap: 0.62rem;
        left: 50%;
        letter-spacing: 0.08em;
        min-height: 4.35rem;
        min-width: 11rem;
        opacity: 0;
        padding: 0.88rem 1.2rem;
        pointer-events: none;
        position: absolute;
        text-transform: uppercase;
        top: 50%;
        transform: translate3d(-50%, -50%, 90px) scale(0.88);
        transition:
          opacity 0.26s ease,
          transform 0.36s var(--ease);
        z-index: 6;
      }

      .play-badge::before {
        border-bottom: 0.48rem solid transparent;
        border-left: 0.72rem solid currentColor;
        border-top: 0.48rem solid transparent;
        content: "";
        display: block;
        height: 0;
        margin-left: 0.1rem;
        width: 0;
      }

      .work-card.is-playing .play-badge {
        background: var(--mark);
        color: #10120e;
      }

      .work-card.is-playing .play-badge.change-mark {
        color: #10120e !important;
        text-shadow: none;
      }

      function titleMarkup(title) {
        const parts = title.split(" ");
        if (parts.length < 2) return title;
        const last = parts.pop();
        return `${parts.join(" ")} <span>${last}</span>`;
      }

      function splitLine(text) {
        return [...text].map((char, index) => {
          const code = char.codePointAt(0) || 32;
          const seed = code * (index + 5);
          const scatterX = ((seed % 23) - 11) * 3.2;
          const scatterY = 38 + ((seed % 17) - 8) * 2.4;
          const scatterRot = ((seed % 37) - 18) * 1.05;
          const htmlChar = char === " " ? "&nbsp;" : char;
          return `<span class="split-char" style="--i:${index}; --scatter-x:${scatterX.toFixed(1)}px; --scatter-y:${scatterY.toFixed(1)}%; --scatter-rot:${scatterRot.toFixed(1)}deg;" aria-hidden="true">${htmlChar}</span>`;
        }).join("");
      }

      function activeTitleMarkup(title) {
        const parts = title.split(" ");
        if (parts.length < 2) {
          return `<span class="title-line">${splitLine(title)}</span>`;
        }
        const last = parts.pop();
        return `<span class="title-line">${splitLine(parts.join(" "))}</span> <span class="title-line">${splitLine(last)}</span>`;
      }

        chars.forEach((char, index) => {
          const delay = Math.abs(index - center) * 34 + (index % 2) * 18;
          char.style.setProperty("--rebuild-delay", `${delay.toFixed(0)}ms`);
        });
      }

        const classes = String(activeTitle.getAttribute("class") || "")

        if (enabled) classes.push("is-rebuilding");
        activeTitle.setAttribute("class", classes.join(" "));
      }

                }

        }
        return Promise.all(nodes.map((node, index) => {
          const extraDelay = typeof stagger === "function" ? stagger(index, nodes.length) : index * stagger;
          const animation = node.animate(keyframes, {
            ...options,
            delay: (options.delay || 0) + extraDelay,
          });
          return animation.finished.catch(() => {});
        }));
      }

      function charScatterTransform(node) {
        const x = node.style.getPropertyValue("--scatter-x") || "0px";
        const y = node.style.getPropertyValue("--scatter-y") || "32%";
        const rotation = node.style.getPropertyValue("--scatter-rot") || "0deg";
        return `translate3d(${x}, ${y}, 0) rotateZ(${rotation}) rotateX(-18deg) scale(0.84)`;
      }

      function animateTitleRebuildFallback(chars) {
        const nodes = Array.from(chars).filter(Boolean);
        if (!nodes.length) return Promise.resolve();
        const duration = 780;
        const easing = "cubic-bezier(0.16, 1, 0.3, 1)";
        const center = (nodes.length - 1) / 2;
        const motionToken = cssMotionToken;
        return Promise.all(nodes.map((node, index) => new Promise((resolve) => {
          const delay = Math.abs(index - center) * 17 + (index % 2) * 14;
          node.style.transition = "none";
          node.style.opacity = "0";
          node.style.filter = "blur(5px)";
          node.style.transform = charScatterTransform(node);
          node.offsetWidth;
          window.setTimeout(() => {
            if (motionToken !== cssMotionToken) {
              resolve();
              return;
            }
            node.style.transition = `opacity ${duration}ms ${easing}, transform ${duration}ms ${easing}, filter ${duration}ms ${easing}`;
            node.style.opacity = "1";
            node.style.filter = "blur(0)";
            node.style.transform = "translate3d(0, 0, 0) rotateZ(0deg) rotateX(0deg) scale(1)";
            window.setTimeout(() => {
              if (motionToken === cssMotionToken) node.style.transition = "";
              resolve();
            }, duration + 40);
          }, delay);
        })));
      }

      function animateActiveTextFallback(applyText) {
        const token = activeTextToken += 1;
        const outgoingChars = activeTitle.querySelectorAll(".split-char");
        const textChrome = [activeKicker, activeKind, activeDesc, activeLink, activeCount];
        cancelElementAnimations([activeTitle, ...textChrome]);

        Promise.all([
          animateElements(outgoingChars, [
            { opacity: 1, transform: "translate3d(0, 0, 0) scaleY(1)" },
            { opacity: 0, transform: "translate3d(0, -18%, 0) scaleY(0.9)" },
          ], {
            duration: 180,
            easing: "cubic-bezier(0.22, 1, 0.36, 1)",
            fill: "forwards",
          }, (index, total) => (total - index) * 4),
          animateElements(textChrome, [
            { opacity: 1, transform: "translate3d(0, 0, 0)" },
            { opacity: 0, transform: "translate3d(0, -10px, 0)" },
          ], {
            duration: 180,
            easing: "cubic-bezier(0.22, 1, 0.36, 1)",
            fill: "forwards",
          }, (index, total) => (total - index) * 14),
        ]).then(() => {
          if (token !== activeTextToken) return;
          applyText();
          activeTitle.style.opacity = "1";
          animateElements(textChrome, [
            { opacity: 0, transform: "translate3d(0, 16px, 0)" },
            { opacity: 1, transform: "translate3d(0, 0, 0)" },
          ], {
            duration: 480,
            easing: "cubic-bezier(0.16, 1, 0.3, 1)",
          }, 26);
        });
      }

      function padIndex(index) {
        return String(index + 1).padStart(2, "0");
      }

      function padTotal(total) {
        return String(total).padStart(2, "0");
      }

      function clamp(min, value, max) {
        return Math.max(min, Math.min(value, max));
      }

      function hexToRgb(hex) {
        const normalized = hex.replace("#", "").trim();
        if (!/^[0-9a-f]{6}$/i.test(normalized)) return [156, 255, 82];
        return [
          parseInt(normalized.slice(0, 2), 16),
          parseInt(normalized.slice(2, 4), 16),
          parseInt(normalized.slice(4, 6), 16),
        ];
      }

      function rgbaFromRgb(rgb, alpha) {
        return `rgba(${rgb[0]}, ${rgb[1]}, ${rgb[2]}, ${alpha})`;
      }

      projects.forEach((project) => {
        project.accentRgb = hexToRgb(project.accent || "#9cff52");
      });

      function setStyle(element, props) {
        if (hasGsap) {
          window.gsap.set(element, { xPercent: -50, yPercent: -50, ...props });
          return;
        }
        const transform = [
          "translate(-50%, -50%)",
          `translate3d(${props.x || 0}px, ${props.y || 0}px, ${props.z || 0}px)`,
          `rotateX(${props.rotationX || 0}deg)`,
          `rotateY(${props.rotationY || 0}deg)`,
          `rotateZ(${props.rotationZ || 0}deg)`,
          `scale(${props.scale || 1})`,
        ].join(" ");
        element.style.transform = transform;
        if (props.opacity !== undefined) element.style.opacity = props.opacity;
      }

      projects.forEach((project, index) => {
        const card = document.createElement("a");
        card.className = "work-card";
        card.href = project.href;
        card.style.setProperty("--media", project.media);
        card.dataset.projectIndex = String(index);
        card.innerHTML = `
          <video class="work-card__video" muted loop playsinline preload="none"></video>
          <span class="work-card__warp" aria-hidden="true"></span>
          <span class="play-badge change-mark" aria-hidden="true">Play</span>
          <div class="work-card__inner">
            <div class="work-card__copy">
              <p class="work-card__index">${padIndex(index)} / ${padTotal(projects.length)}</p>
              <p class="work-card__tag">${project.tag}</p>
              <h2 class="work-card__title">${titleMarkup(project.display)}</h2>
              <p class="work-card__kind">${project.kind}</p>
            </div>
            <div class="work-card__media">
              <span class="work-card__button">Open</span>
            </div>
          </div>
        `;
        track.append(card);
      });

      for (let index = 0; index < projects.length; index += 1) {
        const bar = document.createElement("span");
        bar.className = "wave-progress__bar";
        bar.dataset.projectIndex = String(index);
        bar.setAttribute("role", "button");
        bar.setAttribute("aria-label", projects[index].title);
        bar.tabIndex = 0;
        const center = (projects.length - 1) / 2;
        const distance = Math.abs(index - center);
        const rhythm = 0.45 + Math.sin(index * 0.72) * 0.16 + Math.cos(index * 0.31) * 0.12;
        const height = Math.max(0.86, 2.4 - distance * 0.07 + rhythm);
        bar.style.setProperty("--bar-height", `${height}rem`);
        waveProgress.append(bar);
        waveBars.push(bar);
      }

      const cards = Array.from(document.querySelectorAll(".work-card"));
      let cardHeight = 460;
      let spacing = 560;
      let totalHeight = 0;
      let scrollY = 0;
      let targetScrollY = 0;
      let scrollVelocity = 0;
      let activeIndex = -1;
      let pendingActiveIndex = -1;
      let mouseX = window.innerWidth * 0.66;
      let mouseY = window.innerHeight * 0.5;
      let dampedMouseX = mouseX;
      let dampedMouseY = mouseY;
      let lastTouchY = 0;
      let pointerActive = false;
      let glowXTo = null;
      let glowYTo = null;
      let playCursorXTo = null;
      let playCursorYTo = null;
      let gyroX = 0;
      let gyroY = 0;
      let gyroTargetX = 0;
      let gyroTargetY = 0;
      let didInitialActivePaint = false;
      let previewIndex = 0;
      let lastFrameTime = performance.now();
      let activeTextTimeline = null;
      let backdropTween = null;
      let activeTextToken = 0;
      let cssMotionToken = 0;
      let titleRebuildTimer = 0;
      let snapTimer = 0;
      let gestureDelta = 0;
      let gestureDirection = 0;

      function measure() {
        const firstCard = cards[0];
        cardHeight = firstCard ? firstCard.getBoundingClientRect().height : 520;
        spacing = cardHeight * 0.88 + Math.max(10, window.innerHeight * 0.012);
        totalHeight = spacing * cards.length;
        cards.forEach((card, index) => {
          card.dataset.baseY = String(index * spacing);
          card.dataset.loopIndex = String(index);
        });
      }

      function updateActive(nextIndex) {
        if (nextIndex === activeIndex && activeLink.href) return;
        activeIndex = nextIndex;
        const project = projects[nextIndex];
        const applyText = () => {
          activeKicker.textContent = `Selected Works ${padIndex(nextIndex)}`;
          setActiveTitle(project.title);
          activeKind.textContent = project.kind;
          activeDesc.textContent = project.desc;
          activeLink.href = project.href;
          activeCount.textContent = `${padIndex(nextIndex)} / ${padTotal(projects.length)}`;
        };
        document.body.style.setProperty("--active-media", project.media);
        document.body.style.setProperty("--active-color", project.accent || "#9cff52");
        document.body.style.setProperty("--active-color-rgb", (project.accentRgb || hexToRgb(project.accent || "#9cff52")).join(" "));
        meterLabel.textContent = `Active ${padIndex(nextIndex)}`;
        meterLine.style.transform = `scaleX(${(nextIndex + 1) / projects.length})`;
        waveBars.forEach((bar, index) => {
          const offset = Math.abs(index - nextIndex);
          const wrapDistance = Math.min(offset, projects.length - offset);
          bar.classList.toggle("is-current", index === nextIndex);
          bar.classList.toggle("is-accent", index === (nextIndex + 4) % projects.length);
          bar.classList.toggle("is-active", wrapDistance <= 2);
          const pulse = index === nextIndex ? 1.75 : wrapDistance === 1 ? 1.32 : wrapDistance === 2 ? 1.1 : 1;
          bar.style.transform = `scaleY(${pulse})`;
        });
        updateWavePreview(nextIndex);

        if (!didInitialActivePaint || reduceMotion) {
          applyText();
          didInitialActivePaint = true;
          if (hasGsap) {
            window.gsap.set([activeKicker, activeTitle, activeKind, activeDesc, activeLink, activeCount], {
              autoAlpha: 1,
              clearProps: "transform",
            });
          }
          return;
        }

        if (!hasGsap) {
          animateActiveTextFallback(applyText);
          return;
        }

        if (!activeTitle.querySelector(".split-char")) {
          applyText();
        }

        activeTextToken += 1;
        if (activeTextTimeline) activeTextTimeline.kill();
        if (backdropTween) backdropTween.kill();

        const outgoingChars = activeTitle.querySelectorAll(".split-char");
        const textChrome = [activeKicker, activeKind, activeDesc, activeLink, activeCount];

        activeTextTimeline = window.gsap
          .timeline({ defaults: { ease: "cinemaSnap" } })
          .to(outgoingChars, {
            autoAlpha: 0,
            duration: 0.18,
            filter: "blur(3px)",
            scaleY: 0.9,
            stagger: { each: 0.004, from: "end" },
            yPercent: -18,
          })
          .to(textChrome, {
            autoAlpha: 0,
            duration: 0.18,
            stagger: { each: 0.014, from: "end" },
            y: -10,
            onComplete: applyText,
          }, "-=0.18")
          .set(activeTitle, { autoAlpha: 1, clearProps: "transform" })
          .fromTo(
            activeTitle.querySelectorAll(".split-char"),
            {
              autoAlpha: 0,
              filter: "blur(5px)",
              rotationX: -18,
              rotationZ: (index, target) => target.style.getPropertyValue("--scatter-rot") || "0deg",
              scale: 0.84,
              x: (index, target) => target.style.getPropertyValue("--scatter-x") || "0px",
              yPercent: (index, target) => parseFloat(target.style.getPropertyValue("--scatter-y")) || 32,
            },
            {
              autoAlpha: 1,
              duration: 0.82,
              ease: "cinemaSnap",
              filter: "blur(0px)",
              rotationX: 0,
              rotationZ: 0,
              scale: 1,
              stagger: { each: 0.015, from: "center" },
              x: 0,
              yPercent: 0,
            },
            "-=0.04",
          )
          .fromTo(
            textChrome,
            { autoAlpha: 0, y: 16 },
            { autoAlpha: 1, duration: 0.48, stagger: 0.026, y: 0 },
            "<+0.08",
          );
        backdropTween = window.gsap.fromTo(
          cinemaBackdrop,
          { autoAlpha: 0.48, scale: 1.018 },
          { autoAlpha: 0.78, scale: 1, duration: 0.74, ease: "power2.out" },
        );
      }

      function render() {
        const now = performance.now();
        const frameDelta = clamp(0.72, (now - lastFrameTime) / 16.667, 1.85);
        lastFrameTime = now;
        if (reduceMotion) {
          scrollY = targetScrollY;
          scrollVelocity = 0;
        } else {
          const pull = (targetScrollY - scrollY) * 0.052 * frameDelta;
          scrollVelocity = (scrollVelocity + pull) * Math.pow(0.82, frameDelta);
          scrollY += scrollVelocity * frameDelta;
          if (Math.abs(targetScrollY - scrollY) < 0.04 && Math.abs(scrollVelocity) < 0.04) {
            scrollY = targetScrollY;
            scrollVelocity = 0;
          }
        }
        const pointerDamping = pointerActive ? 0.055 : 0.035;
        dampedMouseX += (mouseX - dampedMouseX) * pointerDamping;
        dampedMouseY += (mouseY - dampedMouseY) * pointerDamping;
        gyroX += (gyroTargetX - gyroX) * (reduceMotion ? 1 : 0.09);
        gyroY += (gyroTargetY - gyroY) * (reduceMotion ? 1 : 0.09);
        track.style.setProperty("--card-gyro-x", `${gyroX}deg`);
        track.style.setProperty("--card-gyro-y", `${gyroY}deg`);
        let closestIndex = activeIndex;
        let closestDistance = Infinity;
        cards.forEach((card) => {
          const baseY = Number(card.dataset.baseY);
          let y = baseY - scrollY;
          y = ((y + totalHeight / 2) % totalHeight + totalHeight) % totalHeight - totalHeight / 2;

          const normalizedY = clamp(-1.2, y / window.innerHeight, 1.2);
          const rotY = 9.4;
          const rotX = -2.2 + normalizedY * 1.8;
          const rotZ = 1.9 - normalizedY * 0.54;
          const centerDist = Math.abs(y);
          const depth = -centerDist * 0.46;
          const opacity = centerDist > window.innerHeight * 1.15 ? 0 : Math.max(0.18, 1 - centerDist / (window.innerHeight * 0.98));
          const baseScale = Math.max(0.72, 1 - centerDist / (window.innerHeight * 5.5));
          const centerFocus = 1 + Math.max(0, 1 - centerDist / (cardHeight * 0.72)) * 0.06;
          const scale = baseScale * centerFocus;
          const distanceToCenter = Math.abs(y);

          if (distanceToCenter < closestDistance) {
            closestDistance = distanceToCenter;
            closestIndex = Number(card.dataset.projectIndex);
          }

          if (opacity <= 0) {
            if (card.style.opacity !== "0") card.style.opacity = "0";
          } else {
            setStyle(card, {
              x: normalizedY * -18,
              y,
              z: depth,
              rotationX: rotX,
              rotationY: rotY,
              rotationZ: rotZ,
              opacity,
              scale,
            });
          }

          const isCardActive = distanceToCenter < cardHeight * 0.54;
          card.classList.toggle("is-active", isCardActive);
          if (!isCardActive && card.classList.contains("is-playing")) {
            stopCardPlayback(card, true);
          }
          const nextZ = String(Math.round(1000 - distanceToCenter));
          if (card.style.zIndex !== nextZ) card.style.zIndex = nextZ;
        });
        const anticipateThreshold = cardHeight * 0.58;
        waveBars.forEach((bar, index) => {
          bar.classList.toggle(
            "is-anticipating",
            index === closestIndex && closestIndex !== activeIndex && closestDistance < anticipateThreshold,
          );
        });
        const activeThreshold = cardHeight * 0.46;
        if (closestDistance < activeThreshold || activeIndex < 0) {
          if (pendingActiveIndex !== closestIndex) pendingActiveIndex = closestIndex;
          updateActive(pendingActiveIndex);
        }
        if (pointerActive) {
          const hoveredCard = document.elementFromPoint(mouseX, mouseY)?.closest?.(".work-card");
          setPlayCursorVisible(Boolean(hoveredCard?.classList.contains("is-active")));
        }
        requestAnimationFrame(render);
      }

      function onWheel(event) {
        const delta = clamp(-120, event.deltaY, 120);
        targetScrollY += delta * 0.62;
        gestureDelta += delta;
        gestureDirection = Math.sign(delta) || gestureDirection;
        scheduleScrollSnap();
      }

      function snapScrollTarget(value, direction = 0) {
        if (!spacing) return value;
        const rawIndex = value / spacing;
        const hasIntent = Math.abs(gestureDelta) > 18;
        let nextIndex = Math.round(rawIndex);
        if (hasIntent && direction > 0) nextIndex = Math.ceil(rawIndex);
        if (hasIntent && direction < 0) nextIndex = Math.floor(rawIndex);
        return nextIndex * spacing;
      }

      function scheduleScrollSnap(delay = 170) {
        window.clearTimeout(snapTimer);
        snapTimer = window.setTimeout(() => {
          targetScrollY = snapScrollTarget(targetScrollY, gestureDirection);
          scrollVelocity *= 0.42;
          gestureDelta = 0;
          gestureDirection = 0;
        }, delay);
      }

      function nearestScrollTarget(index) {
        const base = index * spacing;
        if (!totalHeight) return base;
        const cycle = Math.round((targetScrollY - base) / totalHeight);
        let best = base + cycle * totalHeight;
        [-1, 1].forEach((offset) => {
          const candidate = base + (cycle + offset) * totalHeight;
          if (Math.abs(candidate - targetScrollY) < Math.abs(best - targetScrollY)) {
            best = candidate;
          }
        });
        return best;
      }

      function moveToProject(index) {
        window.clearTimeout(snapTimer);
        gestureDelta = 0;
        gestureDirection = 0;
        scrollVelocity *= 0.18;
        targetScrollY = nearestScrollTarget(index);
      }

      function updateWavePreview(index, clientX = null) {
        previewIndex = clamp(0, index, projects.length - 1);
        const project = projects[previewIndex];
        if (wavePreviewLabel) {
          wavePreviewLabel.textContent = `${padIndex(previewIndex)} - ${project.title}`;
        }
        if (wavePreviewThumb) {
          wavePreviewThumb.style.setProperty("--preview-media", project.media);
        }
        if (waveProgress && clientX !== null) {
          const rect = waveProgress.getBoundingClientRect();
          const x = clamp(10, clientX - rect.left, rect.width - 10);
          waveProgress.style.setProperty("--preview-x", `${x}px`);
        }
        waveBars.forEach((bar, index) => {
          bar.classList.toggle("is-preview-current", waveProgress?.classList.contains("is-previewing") && index === previewIndex);
        });
      }

      function getBarCenterX(bar) {
        const rect = bar.getBoundingClientRect();
        return rect.left + rect.width / 2;
      }

      function previewBar(bar) {
        const index = Number(bar.dataset.projectIndex);
        waveProgress.classList.add("is-previewing");
        updateWavePreview(index, getBarCenterX(bar));
      }

      function onWaveLeave() {
        waveProgress.classList.remove("is-previewing");
        waveBars.forEach((bar) => bar.classList.remove("is-preview-current"));
      }

      function onPointerMove(event) {
        pointerActive = true;
        mouseX = event.clientX;
        mouseY = event.clientY;
        gyroTargetX = clamp(-10.7, ((mouseX / window.innerWidth) - 0.5) * -16.4, 10.7);
        gyroTargetY = clamp(-7.5, ((mouseY / window.innerHeight) - 0.5) * 12.7, 7.5);
        if (hasGsap && glow) {
          glowXTo(mouseX);
          glowYTo(mouseY);
        } else if (glow) {
          glow.style.transform = `translate3d(${mouseX}px, ${mouseY}px, 0) translate(-50%, -50%)`;
        }
        if (hasGsap && playCursor) {
          playCursorXTo(mouseX);
          playCursorYTo(mouseY);
        } else if (playCursor) {
          playCursor.style.transform = `translate3d(${mouseX}px, ${mouseY}px, 0) translate(-50%, -50%)`;
        }
      }

      function setPlayCursorVisible(visible) {
        if (!playCursor) return;
        playCursor.classList.toggle("is-visible", visible);
      }

      function stopCardPlayback(card, resetTime = false) {
        card.classList.remove("is-playing");
        const video = card.querySelector(".work-card__video");
        if (!video) return;
        video.pause();
        if (resetTime) {
          try {
            video.currentTime = 0;
          } catch (error) {
            // Some browsers disallow seeking before enough media metadata is loaded.
          }
        }
      }

      function onTouchStart(event) {
        lastTouchY = event.touches[0].clientY;
        window.clearTimeout(snapTimer);
        gestureDelta = 0;
        gestureDirection = 0;
      }

      function onTouchMove(event) {
        const nextY = event.touches[0].clientY;
        const delta = lastTouchY - nextY;
        targetScrollY += delta * 1.62;
        gestureDelta += delta;
        gestureDirection = Math.sign(delta) || gestureDirection;
        lastTouchY = nextY;
      }

      function onTouchEnd() {
        scheduleScrollSnap(70);
      }

      if (window.innerWidth > 980) {
        measure();
        scrollY = 0;
        targetScrollY = 0;
        updateActive(0);
        cards.forEach((card) => {
          card.addEventListener("pointerenter", () => {
            if (card.classList.contains("is-active")) setPlayCursorVisible(true);
          });
          card.addEventListener("pointerleave", () => setPlayCursorVisible(false));
          card.addEventListener("click", (event) => {
            if (!card.classList.contains("is-active")) return;
            event.preventDefault();
            cards.forEach((item) => {
              if (item !== card) stopCardPlayback(item, true);
            });
            const project = projects[Number(card.dataset.projectIndex)];
            const video = card.querySelector(".work-card__video");
            if (video && project?.video) {
              if (!video.getAttribute("src")) {
                video.src = project.video;
                video.load();
              }
              card.classList.add("is-playing");
              video.play().catch(() => {
                stopCardPlayback(card, true);
              });
              return;
            }
            stopCardPlayback(card, true);
          });
        });
        window.addEventListener("wheel", onWheel, { passive: true });
        window.addEventListener("pointermove", onPointerMove, { passive: true });
        window.addEventListener("touchstart", onTouchStart, { passive: true });
        window.addEventListener("touchmove", onTouchMove, { passive: true });
        window.addEventListener("touchend", onTouchEnd, { passive: true });
        waveProgress.addEventListener("pointerleave", onWaveLeave);
        waveProgress.addEventListener("click", (event) => {
          const bar = event.target.closest?.(".wave-progress__bar");
          if (!bar) return;
          const index = Number(bar.dataset.projectIndex);
          updateWavePreview(index, getBarCenterX(bar));
          moveToProject(index);
        });
        waveBars.forEach((bar) => {
          bar.addEventListener("pointerenter", () => previewBar(bar));
          bar.addEventListener("pointermove", () => previewBar(bar), { passive: true });
          bar.addEventListener("focus", () => {
            const index = Number(bar.dataset.projectIndex);
            waveProgress.classList.add("is-previewing");
            updateWavePreview(index, getBarCenterX(bar));
          });
          bar.addEventListener("keydown", (event) => {
            if (event.key !== "Enter" && event.key !== " ") return;
            event.preventDefault();
            moveToProject(Number(bar.dataset.projectIndex));
          });
        });
        window.addEventListener("resize", () => {
          measure();
        });
        if (hasGsap && glow) {
          window.gsap.set(glow, { x: mouseX, y: mouseY });
          glowXTo = window.gsap.quickTo(glow, "x", { duration: 0.55, ease: "power2.out" });
          glowYTo = window.gsap.quickTo(glow, "y", { duration: 0.55, ease: "power2.out" });
        }
        if (hasGsap && playCursor) {
          window.gsap.set(playCursor, { x: mouseX, y: mouseY });
          playCursorXTo = window.gsap.quickTo(playCursor, "x", { duration: 0.18, ease: "power3.out" });
          playCursorYTo = window.gsap.quickTo(playCursor, "y", { duration: 0.18, ease: "power3.out" });
        }
        requestAnimationFrame(render);
      } else {
        document.body.classList.add("is-reduced");
        updateActive(0);
      }
    </script>
  </body>
</html>
